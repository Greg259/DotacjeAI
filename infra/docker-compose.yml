name: dotacje-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  APP_ENV: production
  APP_VERSION: "0.3.0"
  LOG_LEVEL: INFO
  SOURCE_STORAGE_ROOT: /data/source-snapshots
  CRAWLER_USER_AGENT: "DotacjeAI/0.3 (+https://dotacjeai.eu)"
  CRAWLER_TIMEOUT_SECONDS: 30
  CRAWLER_RETRIES: 3
  CRAWLER_MAX_RESPONSE_BYTES: 26214400
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  LLM_PROVIDER: ${LLM_PROVIDER}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  LLM_MODEL_FAST: ${LLM_MODEL_FAST}
  LLM_MODEL_STRONG: ${LLM_MODEL_STRONG}
  LLM_MODEL_VALIDATOR: ${LLM_MODEL_VALIDATOR}
  LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD}
  LLM_WARNING_BUDGET_USD: ${LLM_WARNING_BUDGET_USD:-5}
  LLM_CRITICAL_BUDGET_USD: ${LLM_CRITICAL_BUDGET_USD:-8}
  LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2015/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  frontend:
    build:
      context: ../apps/frontend
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  api:
    image: dotacje-ai-api:local
    build:
      context: ../apps/api
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge
      - backend

  crawler:
    image: dotacje-ai-api:local
    profiles: ["jobs"]
    command: ["python", "-m", "app.cli.crawl_sources"]
    user: "1000:1000"
    environment: *api-environment
    volumes:
      - /opt/dotacje-ai/data/documents/sources:/data/source-snapshots
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 768m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge
      - backend

  migrate:
    image: dotacje-ai-api:local
    build:
      context: ../apps/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.00
    shm_size: 256m
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 512m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
